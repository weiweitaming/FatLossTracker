name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Package macOS app
        run: |
          ./build-app.sh
          tar -czf FatLossTracker-macos.tar.gz FatLossTracker.app
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: FatLossTracker-macos
          path: FatLossTracker-macos.tar.gz
          if-no-files-found: error
